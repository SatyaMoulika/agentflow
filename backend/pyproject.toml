[project]
name = "agentflow-backend"
version = "0.1.0"
description = "AgentFlow API foundation; PostgreSQL-backed modules follow incrementally"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18,<2",
    "argon2-cffi>=25.1,<26",
    "celery[redis]>=5.6,<5.7",
    "cryptography>=46,<52",
    "email-validator>=2.3,<3",
    "fastapi>=0.162.0,<0.163",
    "httpcore>=1.0.9,<1.1",
    "httpx>=0.28.1,<0.29",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langsmith>=0.14,<0.15",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.14.2,<3",
    "pydantic-settings>=2,<3",
    "pyjwt>=2.15,<3",
    "requests>=2.32,<3",
    "sqlalchemy>=2.0.55,<2.1",
    "uvicorn>=0.54.0,<0.55",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1,<3",
    "pyright>=1.1.414,<1.2",
    "pytest>=9.2,<10",
    "ruff>=0.17.3,<0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires an explicitly configured real PostgreSQL test database",
    "redis_integration: requires an explicitly configured isolated Redis test instance",
]

[tool.pyright]
include = ["app", "tests", "scripts", "migrations"]
exclude = ["agentflow", ".venv", "**/__pycache__"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
